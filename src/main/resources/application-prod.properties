# Perfil de produccion: sin show-sql y sin valores por defecto.
spring.jpa.show-sql=false

# En produccion los secretos deben venir del entorno.
# Sin default: la app NO arranca si faltan (fail-fast).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT_SECRET (obligatorio en prod, validado al arrancar en StartupSecurityCheck)

# CORS: obligatorio en produccion (sin default de desarrollo: fail-fast)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# URL publica del frontend (back_url del checkout de MP): obligatoria
app.frontend-url=${APP_FRONTEND_URL}

# URL publica del webhook de MP: si falta, la app arranca y WebhookRegistrar
# avisa en el log en lugar de registrar contra una URL de tunel muerta
app.webhook-url=${APP_WEBHOOK_URL:}
