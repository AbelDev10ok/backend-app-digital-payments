# Perfil de produccion: sin show-sql y sin valores por defecto.
spring.jpa.show-sql=false

# En produccion los secretos deben venir del entorno.
# Sin default: la app NO arranca si faltan (fail-fast).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT_SECRET (obligatorio en prod, validado al arrancar en StartupSecurityCheck)
