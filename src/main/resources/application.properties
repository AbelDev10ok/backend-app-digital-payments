spring.application.name=digital-pyments

# Server port
server.port=8080

# Database configuration postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digital_payments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Ludmila10ok.}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
# El esquema se administra desde las entidades (sin Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Ejecutar data.sql despues de que Hibernate cree el esquema
spring.jpa.defer-datasource-initialization=true

# Datos iniciales (data.sql): roles base
spring.sql.init.mode=always

# Flyway deshabilitado
spring.flyway.enabled=false

# CORS (comma-separated)
app.cors.allowed-origins=https://numerate-crumpet-oxymoron.ngrok-free.dev,http://localhost:5173

# Rate limit (solicitudes por minuto, por IP+ruta)
app.rate-limit.max-requests-per-minute=${APP_RATE_LIMIT_PER_MINUTE:10}
# Limite mas estricto para login/register/refresh/forgot/reset
app.rate-limit.sensitive-requests-per-minute=${APP_RATE_LIMIT_SENSITIVE_PER_MINUTE:5}
# Solo confiar en X-Forwarded-For/X-Real-IP si hay proxy reverso de confianza
app.rate-limit.trust-proxy=${APP_RATE_LIMIT_TRUST_PROXY:false}

# Mercado Pago - Suscripciones

app.mercadopago.access-token=${APP_MERCADOPAGO_ACCESS_TOKEN:APP_USR-6123795434047797-101122-490a7859217c04e32cfc8a708d33b380-3747194464}
app.mercadopago.webhook-secret=${APP_MERCADOPAGO_WEBHOOK_SECRET:c4c541639678d53853734e01f4eca23c70cac37af8ac0555d77aec3ae42bdee5}
# Firma del webhook: obligatoria cuando hay secreto configurado (desactivar solo en desarrollo)
app.mercadopago.webhook-require-signature=${APP_WEBHOOK_REQUIRE_SIGNATURE:true}

# URL del frontend (para back_url de MP)
