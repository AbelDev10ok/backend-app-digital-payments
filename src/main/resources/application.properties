spring.application.name=digital-pyments

# Server port
server.port=8080

# Database configuration postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digital_payments}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Ludmila10ok.}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configuration
# El esquema se administra desde las entidades (sin Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Ejecutar data.sql despues de que Hibernate cree el esquema
spring.jpa.defer-datasource-initialization=true

# Datos iniciales (data.sql): roles base
spring.sql.init.mode=always

# Flyway deshabilitado
spring.flyway.enabled=false

# CORS: origenes permitidos separados por comas
# (en deploy, definir APP_CORS_ALLOWED_ORIGINS; el default es el frontend local)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limit (solicitudes por minuto, por IP+ruta)
app.rate-limit.max-requests-per-minute=${APP_RATE_LIMIT_PER_MINUTE:10}
# Limite mas estricto para login/register/refresh/forgot/reset
app.rate-limit.sensitive-requests-per-minute=${APP_RATE_LIMIT_SENSITIVE_PER_MINUTE:5}
# Solo confiar en X-Forwarded-For/X-Real-IP si hay proxy reverso de confianza
app.rate-limit.trust-proxy=${APP_RATE_LIMIT_TRUST_PROXY:false}

# Mercado Pago - Suscripciones
# Sin credenciales en el repo: se leen solo del entorno. Si faltan, la app
# arranca en desarrollo pero las suscripciones quedan deshabilitadas.
# En produccion (application-prod.properties) son obligatorias.
app.mercadopago.access-token=${APP_MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.webhook-secret=${APP_MERCADOPAGO_WEBHOOK_SECRET:}
# Firma del webhook: obligatoria cuando hay secreto configurado (desactivar solo en desarrollo)
app.mercadopago.webhook-require-signature=${APP_WEBHOOK_REQUIRE_SIGNATURE:true}

# URL publica del frontend: la usa el mail de restablecimiento de contraseña
# (link a /reset-password) y el back_url del checkout de MP. Para dev local:
# http://localhost:5173 (Vite habla http, no https).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# URL del webhook para notificaciones de MP (vacio en desarrollo:
# WebhookRegistrar avisa en el log y no registra nada en MP)
app.webhook-url=${APP_WEBHOOK_URL:}
